[package]
name = "iytmr"
version = "0.9.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.1"
dotenvy = "0.15"
futures = "0.3"
log = "0.4"
pretty_env_logger = "0.5"
rand = "0.10"
rust-i18n = "3"
redb = "3.1"
regex = "1.12"
reqwest = { version = "0.12", features = ["brotli", "deflate", "gzip", "multipart", "socks", "stream", "zstd", "rustls-tls", "hickory-dns"] }
rmp = "0.8"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
teloxide = { version = "0.17", features = ["ctrlc_handler", "macros", "tracing"] }
tokio = { version = "1.50", features = ["full"] }
url = "2.5"
walkdir = "2.5"
# Only the persistent (redb) download cache tier is enabled: the in-memory tier records
# the output file's own path as the cached path, so its hits either truncate the file to
# zero bytes (same-path copy) or fail with ENOENT once the file is removed between retries.
yt-dlp = { version = "2.7.2", default-features = false, features = ["hickory-dns", "cache-redb", "rustls"] }

# fix use of yanked lofty version
[patch.crates-io]
yt-dlp = { git = "https://github.com/lapismyt/yt-dlp" }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
